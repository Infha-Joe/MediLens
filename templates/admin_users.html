{% extends "base.html" %}
{% block title %}Manage Users · MediLens{% endblock %}
{% block content %}
<div class="mb-6">
  <h1 class="text-2xl font-bold mb-2">Customer Management</h1>
  <p class="text-muted">Review and manage customer accounts.</p>
</div>

<div class="card p-0 overflow-hidden border">
  <div class="table-container" style="border:none; box-shadow:none; border-radius:0">
    <table>
      <thead>
        <tr><th>Name</th><th>Email</th><th>Status</th><th>Action</th></tr>
      </thead>
      <tbody>
        {% for u in rows %}
        <tr>
          <td class="font-semibold">{{ u.name }}</td>
          <td class="text-muted">{{ u.email }}</td>
          <td><span class="badge badge-{% if u.status == 'active' %}success{% else %}danger{% endif %}">{{ u.status }}</span></td>
          <td>
            <form method="post" action="{{ url_for('admin.user_toggle', uid=u._id) }}">
              <button class="btn btn-outline btn-sm {% if u.status != 'blocked' %}btn-danger{% endif %}">
                {{ 'Unblock' if u.status == 'blocked' else 'Block' }}
              </button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
