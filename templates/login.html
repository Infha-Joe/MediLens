{% extends "base.html" %}
{% block title %}Log in · MediLens{% endblock %}
{% block auth_content %}
<div class="text-center mb-8">
  <h2 class="text-2xl font-semibold text-deep mb-2">Welcome back</h2>
  <p class="text-muted">Enter your credentials to access your account</p>
</div>
<form method="post">
  <div class="form-group">
    <label for="email">Email</label>
    <div style="position:relative">
      <i data-lucide="mail" style="position:absolute; left:12px; top:12px; width:18px; color:var(--text-muted)"></i>
      <input id="email" name="email" type="email" required autocomplete="email" style="padding-left: 40px">
    </div>
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <div style="position:relative">
      <i data-lucide="lock" style="position:absolute; left:12px; top:12px; width:18px; color:var(--text-muted)"></i>
      <input id="password" name="password" type="password" required autocomplete="current-password" style="padding-left: 40px">
    </div>
  </div>
  <button type="submit" class="btn w-full mt-4">Sign In <i data-lucide="arrow-right" style="width:18px"></i></button>
</form>
<p class="text-center mt-6 text-sm text-muted">New to MediLens? <a href="{{ url_for('auth.register') }}" class="font-semibold">Create an account</a></p>
{% endblock %}
