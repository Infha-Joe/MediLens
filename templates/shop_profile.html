{% extends "base.html" %}
{% block title %}Shop details · MediLens{% endblock %}
{% block content %}
<div class="mb-6">
  <h1 class="text-2xl font-bold mb-2">Shop Profile</h1>
  <p class="text-muted">Update your pharmacy details.</p>
</div>

<div class="card max-w-lg">
  <form method="post">
    <div class="form-group">
      <label for="address">Full Address</label>
      <textarea id="address" name="address" rows="3" required>{{ shop.address }}</textarea>
    </div>
    <div class="form-group">
      <label for="phone">Contact Phone</label>
      <input id="phone" name="phone" value="{{ shop.phone }}">
    </div>
    <div class="form-group">
      <label for="hours">Opening Hours</label>
      <input id="hours" name="hours" value="{{ shop.hours }}" placeholder="e.g. 9:00 AM - 9:00 PM">
    </div>

    <button type="submit" class="btn">Save Changes</button>
  </form>
</div>
{% endblock %}
